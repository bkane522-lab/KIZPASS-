<!DOCTYPE html>
<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<meta content="#B9A3DC" name="theme-color"/>
<meta content="yes" name="apple-mobile-web-app-capable"/>
<title>KIZPASS — Ton passeport de danse</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<link href="manifest.webmanifest" rel="manifest"/><link href="styles.css" rel="stylesheet"/><link href="icons/icon-192.png" rel="apple-touch-icon"/><meta content="KIZPASS — le passeport numérique des danseurs Kizomba." name="description"/></head>
<body>
<div class="wrap">
<div class="brand">
<div class="seal"><span>K</span></div>
<div><b>KIZPASS</b><span id="subtitle">PASSEPORT DE DANSE</span></div>
<button class="install-btn" hidden="" id="installBtn">Installer</button></div>
<div class="view on" id="v-pass">
<div class="pass" id="passCard">
<div class="crown">
<b>COMMUNAUTÉ KIZOMBA</b>
<i>TYPE · KP<b>N° <span id="passno">—</span></b></i>
</div>
<div class="pass-body">
<div class="idrow">
<div aria-label="Changer la photo" class="photo" id="photo" role="button" tabindex="0">
<svg viewbox="0 0 24 24"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5C21 16.5 17 14 12 14z"></path></svg>
<div aria-hidden="true" class="cam">📷</div>
</div>
<div class="fields">
<div class="field"><div class="k">Nom / Blaze</div><div class="v" id="f-name">—</div></div>
<div class="field"><div class="k">Rôle</div><div class="v small" id="f-role">—</div></div>
<div class="field"><div class="k">Origine</div><div class="v small" id="f-origin">—</div></div>
<div class="field"><div class="k">Styles</div><div class="chips" id="f-styles"></div></div>
</div>
</div>
<div class="grid2">
<div class="field"><div class="k">Niveau</div><div class="v small" id="f-level">—</div></div>
<div class="field"><div class="k">Danse depuis</div><div class="v small" id="f-since">—</div></div>
<div class="field" style="grid-column:1/-1"><div class="k">Professeurs</div><div class="v small" id="f-teachers">—</div></div>
</div>
<div class="motto"><div class="k">DEVISE</div><div class="v" id="f-motto">—</div></div>
<div class="mrz" id="mrz"><div>—</div><div>—</div></div>
</div>
</div>
<div class="hint" id="hint">Complète ton passeport pour commencer</div><button class="edit-pass-btn" id="editPass">Modifier mon Pass</button>
<div class="section-h">
<h2>TAMPONS</h2>
<button class="add" id="addStamp">＋ Tamponner</button>
</div>
<div class="stamps" id="stamps"></div>
<div class="stats">
<div class="stat"><b id="s-fest">0</b><span>Tampons</span></div>
<div class="stat"><b id="s-city">0</b><span>Villes</span></div>
<div class="stat"><b id="s-style">0</b><span>Styles</span></div>
</div><button class="share-pass-btn" id="share">Partager mon KIZPASS</button>
</div>
<div class="view" id="v-events">
<div class="section-h" style="margin-top:4px">
<h2>À VENIR</h2><span class="count" id="ev-count">—</span>
</div>
<div id="events"></div>
</div>
<div class="view" id="v-people">
<div class="section-h" style="margin-top:4px">
<h2>DANSEURS</h2><span class="count" id="pp-count">—</span>
</div>
<div class="people" id="people"></div>
</div>
</div>

<nav class="nav">
<button class="tab on" data-v="pass"><i>🪪</i><b>Mon Pass</b></button>
<button class="tab" data-v="events"><i>📍</i><b>Événements</b></button>
<button class="tab" data-v="people"><i>👥</i><b>Danseurs</b></button>
</nav>
<div class="sheet" id="editSheet">
<div class="sheet-inner">
<h3>Éditer le Pass</h3>
<label class="f"><span class="k">Nom / Blaze</span><input class="in" id="e-name" placeholder="Ton blaze"/></label>
<label class="f"><span class="k">Rôle</span><input class="in" id="e-role" placeholder="Leader · Follower · DJ · Prof"/></label>
<div class="row2">
<label class="f"><span class="k">Origine</span><input class="in" id="e-origin" placeholder="Ta ville"/></label>
<label class="f"><span class="k">Danse depuis</span><input class="in" id="e-since" placeholder="2019"/></label>
</div>
<label class="f"><span class="k">Styles (virgules)</span><input class="in" id="e-styles" placeholder="Kizomba, Urban Kiz, Semba"/></label>
<label class="f"><span class="k">Niveau</span><input class="in" id="e-level" placeholder="Intermédiaire +"/></label>
<label class="f"><span class="k">Professeurs</span><input class="in" id="e-teachers"/></label>
<label class="f"><span class="k">Devise</span><input class="in" id="e-motto" placeholder="Ta phrase"/></label>
<div class="sheet-actions">
<button class="btn btn-primary" id="saveProfile">Enregistrer</button>
<button class="btn btn-ghost" id="cancelProfile">Annuler</button>
</div>
</div>
</div>
<div class="sheet" id="stampSheet">
<div class="sheet-inner">
<h3 id="stampTitle">Nouveau tampon</h3>
<label class="f"><span class="k">Festival / Social</span><input class="in" id="st-name"/></label>
<div class="row2">
<label class="f"><span class="k">Ville</span><input class="in" id="st-city"/></label>
<label class="f"><span class="k">Année</span><input class="in" id="st-year" inputmode="numeric"/></label>
</div>
<label class="f"><span class="k">Ton ressenti</span></label>
<div class="rate" id="st-rate">
<button data-v="1">★</button><button data-v="2">★</button><button data-v="3">★</button><button data-v="4">★</button><button data-v="5">★</button>
</div>
<div class="sheet-actions" style="margin-top:16px">
<button class="btn btn-primary" id="saveStamp">Tamponner</button>
<button class="btn btn-ghost" id="cancelStamp">Annuler</button>
</div>
</div>
</div>
<input accept="image/*" hidden="" id="fileIn" type="file">

</input><script defer="True" src="app.js"></script></body>
</html>
